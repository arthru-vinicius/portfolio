name: Audit

# Fora do verify de propósito: um alerta novo numa dependência indireta não pode
# travar o deploy de um conserto urgente sem relação com ela. O resultado
# aparece no pull request, e a execução semanal pega alertas novos na main.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # O audit lê só o package-lock.json; não precisa instalar nada.
      - run: npm audit --audit-level=high
